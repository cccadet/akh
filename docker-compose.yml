services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: akh
      POSTGRES_USER: akh
      POSTGRES_PASSWORD: akh-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - akh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  akh-postgres:

