name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as file:
              cargo_version = tomllib.load(file)['workspace']['package']['version']
          with open('apps/desktop/src-tauri/tauri.conf.json', encoding='utf-8') as file:
              desktop_version = json.load(file)['version']
          with open('apps/desktop/package.json', encoding='utf-8') as file:
              frontend_version = json.load(file)['version']
          tag = os.environ['RELEASE_TAG']
          expected = f'v{cargo_version}'
          if tag != expected or desktop_version != cargo_version or frontend_version != cargo_version:
              raise SystemExit(f'Version mismatch: tag={tag}, Cargo={cargo_version}, Tauri={desktop_version}, npm={frontend_version}; expected {expected}')
          PY

  windows:
    needs: check-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build CLI and PostgreSQL server
        run: cargo build --release --locked -p akh-cli -p akh-server
      - name: Build Windows installer with bundled CLI
        working-directory: apps/desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: akh-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build CLI and PostgreSQL server
        run: cargo build --release --locked -p akh-cli -p akh-server
      - name: Build Linux package with bundled CLI
        working-directory: apps/desktop
        run: npm run tauri build -- --config src-tauri/tauri.linux.conf.json
      - name: Pack standalone CLI and server for WSL/Linux
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-cli
          cp target/release/akh release-cli/akh
          cp target/release/akh-server release-cli/akh-server
          tar -C release-cli -czf "target/release/akh-${RELEASE_TAG}-linux-x86_64.tar.gz" akh akh-server
      - name: Verify Linux package and archive contents
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb -c "$package" | grep -E '/usr/bin/(akh|akh-server)$'
          dpkg-deb -x "$package" package-check
          test -x package-check/usr/bin/akh
          test -x package-check/usr/bin/akh-server
          package-check/usr/bin/akh --version
          tar -tzf "target/release/akh-${RELEASE_TAG}-linux-x86_64.tar.gz" | grep -x akh-server
      - uses: actions/upload-artifact@v4
        with:
          name: akh-linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/akh-v*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: akh-*
          path: release
          merge-multiple: true
      - name: Publish release after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' -t assets < <(find release -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No release assets were downloaded' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Akh $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
